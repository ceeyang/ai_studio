[project]
name = "ai-studio"
version = "0.1.0"
description = "本机 AI 漫剧工作台"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "websockets>=13.0",
  "jinja2>=3.1",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "psutil>=5.9",
  "claude-agent-sdk>=0.1",
  "python-multipart>=0.0.9",
  "edge-tts>=7.2.8",
  "pillow>=12.3.0",
  "numpy>=2.5.3",
  "playwright>=1.50",   # 网页出图（gpt_image / gemini_image）：connect_over_cdp 连 studio 管的浏览器，不需要 playwright install
  "pypinyin>=0.55.0",
]

[project.scripts]
studio = "cli.studio:main"
studio-server = "backend.app.main:run"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "cli"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
timeout = 60
