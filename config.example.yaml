# 复制为 config.yaml 后按本机情况修改。config.yaml 不进 git。
server:
  host: 127.0.0.1
  port: 8700
  data_dir: projects

comfyui:
  url: http://127.0.0.1:8188
  # 只给 doctor 检查模型文件是否存在
  models_dir: C:\Users\cee\AppData\Local\Comfy-Desktop\ComfyUI-Shared\models
  timeout: 30
  max_retries: 6

llm:
  default: claude
  providers:
    - id: lmstudio
      kind: openai
      base_url: http://127.0.0.1:1234/v1
      model: null            # 填 `lms ls` 里的模型 id
      local_gpu: true        # 调用时与 GPU 任务互斥
      unload_cmd: [lms, unload, --all]
    - id: claude
      kind: claude
      use_sdk: true          # 失败自动退回 claude -p
    - id: manual
      kind: manual
  routes:
    script: claude
    storyboard: claude

engines:
  zimage: {enabled: true, params: {}}
  h3_image: {enabled: true, params: {turbo: false}}
  h3_video: {enabled: true, params: {turbo: true}}
  wan22_i2v: {enabled: true, params: {}}

ffmpeg:
  ffmpeg: ffmpeg
  ffprobe: ffprobe

# 生产态由后端托管的前端构建目录（cd frontend; npm run build 生成）；目录不存在就只提供 API
frontend_dist: frontend/dist
