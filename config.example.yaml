# 复制为 config.yaml 后按本机情况修改。config.yaml 不进 git。
server:
  host: 127.0.0.1
  port: 8700
  data_dir: projects

comfyui:
  url: http://127.0.0.1:8188
  # 只给 doctor 检查模型文件是否存在
  models_dir: C:\Users\cee\AppData\Local\Comfy-Desktop\ComfyUI-Shared\models
  timeout: 30
  max_retries: 6
  # 队列空闲超过这么多秒（自上一个 GPU 任务结束算起）就自动调一次 ComfyUI 的 /free，
  # 把显存和内存还回去；设成 0 关闭自动释放。
  idle_free_seconds: 120

llm:
  default: claude
  providers:
    - id: lmstudio
      kind: openai
      base_url: http://127.0.0.1:1234/v1
      model: null            # 填 `lms ls` 里的模型 id
      local_gpu: true        # 调用时与 GPU 任务互斥
      unload_cmd: [lms, unload, --all]
    - id: claude
      kind: claude
      use_sdk: true          # 失败自动退回 claude -p
    - id: manual
      kind: manual
  routes:
    script: claude
    storyboard: claude
    subtitles.translate: claude   # 高棉语字幕译稿（AI 草稿，发布前要母语者校对）

engines:
  zimage: {enabled: true, params: {}}
  # Krea2 人像（moodyCutieMixKrea2 + qwen3vl_4b 文本编码 + qwen_image VAE），文生图，不吃参考图
  krea2: {enabled: true, params: {}}
  h3_image: {enabled: true, params: {turbo: false}}
  h3_video: {enabled: true, params: {turbo: true}}
  wan22_i2v: {enabled: true, params: {}}
  # 网页出图：在已经登录的浏览器里（默认是装了 browser-extension 的你平时用的浏览器，见下面 browser），
  # 在 chatgpt.com / gemini.google.com 上出图，
  # 不用 API key、不占显卡。timeout 是等出图的最长秒数；fit_aspect 把出来的图居中裁成要求的画幅。
  gpt_image: {enabled: true, params: {timeout: 420, fit_aspect: true}}
  gemini_image: {enabled: true, params: {timeout: 300, fit_aspect: true}}

# RunningHub 云端 ComfyUI（可选，不写就没有云端引擎）。API key 不写在这里：在 .env 里写
# RUNNINGHUB_API_KEY=你的 key（RunningHub 网站 → 个人中心 → API 控制台）。没有 key 时 doctor 报警告、提交任务直接拒绝。
# 每个引擎对应一个云端工作流（workflow_id）或 AI 应用（webapp_id），参数映射见 workflows/runninghub_example.map.yaml。
# runninghub:
#   base_url: https://www.runninghub.cn
#   api_key_env: RUNNINGHUB_API_KEY
#   engines:
#     rh_flux: {kind: image, workflow_id: "1234567890", label: "Flux 云端"}       # map 默认 runninghub_rh_flux.map.yaml
#     rh_wan: {kind: video, webapp_id: "9876543210", map: runninghub_rh_wan.map.yaml}

# 网页出图用的浏览器。
# transport: extension（默认）——出图在你平时用的 Chrome/Edge 里进行：在那个浏览器里加载仓库下的
#   browser-extension（chrome://extensions → 开发者模式 → 加载已解压的扩展程序），并登录 ChatGPT 和 Gemini。
#   扩展用 WebSocket 连 studio（ws://127.0.0.1:8700/api/browser/ext），在已登录的标签页里开新对话出图，
#   把原图传回来。studio 不启动浏览器、不读也不拷 cookie。设置页能看到扩展连没连上、各网站登没登录。
# transport: cdp（备用）——studio 用单独的配置目录带调试端口启动 Chrome（找不到就用 Edge），在设置页点
#   「打开浏览器登录」，在弹出的窗口里登录一次。Chrome 136 起默认配置目录不许开远程调试，所以这种方式
#   不能用你平时的浏览器配置。下面 executable 到 headless 只给 cdp 用。
browser:
  transport: extension
  extension_id: null          # 只接受这个 id 的扩展连接（chrome://extensions 里看）；null 不限制
  reuse_conversation: false   # true：在标签页当前的对话里接着发（默认每次开新对话，不混进你的对话）
  reuse_user_tabs: true       # 可以借用你开着、没在看、没在生成的 ChatGPT / Gemini 标签页（会切到新对话）
  activate_tab: false         # 出图时把标签页切到前台（后台标签页被浏览器冻结、图出不来时打开）
  executable: null            # cdp：不写就自动找 Chrome，再找 Edge
  user_data_dir: browser-profile   # cdp：相对本文件；里面有登录 cookie，不进 git
  cdp_port: 9333
  headless: false

ffmpeg:
  ffmpeg: ffmpeg
  ffprobe: ffprobe

# 字幕和片尾卡的字体（libass 按字体族名找字）。fonts_dir 默认 %WINDIR%\Fonts，
# font_files 里的文件会拷进导出工作目录给 libass 用。
subtitles:
  zh_font: Microsoft YaHei
  km_font: Khmer UI          # 也可以用 Leelawadee UI
  latin_font: Arial
  # fonts_dir: C:\Windows\Fonts
  # font_files: [msyh.ttc, msyhbd.ttc, KhmerUI.ttf, KhmerUIb.ttf, LeelawUI.ttf, LeelaUIb.ttf, arial.ttf, arialbd.ttf]

# 高棉语外挂配音（Edge TTS，需要联网）。音色写在角色上（studio character voice）。
dub:
  bed_db: -14      # 原音轨压低多少当环境底
  duck_db: -30     # 台词窗口内原音轨再压到多少（盖住 H3 的普通话人声）
  max_rate: 35     # 台词塞不进窗口时最多提速 +35%
  loudness: -14    # 配音版整体响度（LUFS）

# 生产态由后端托管的前端构建目录（cd frontend; npm run build 生成）；目录不存在就只提供 API
frontend_dist: frontend/dist
